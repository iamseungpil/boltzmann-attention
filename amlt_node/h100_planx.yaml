description: "boltzmann-attention plan X (cross-bench) P3 — single 4xH100 node. SOPBench+TaskBench -> native FC -> Qwen2.5-7B TBox LoRA. AUTO-RECOVERY: job command bootstraps (clone+setup) then node_run_planx.sh; on preemption restart, converters skip via markers, HF state restores the adapter checkpoint, trainer --resume continues. No train/eval in job name -> no SOPBench/TaskBench driver dispatch -> single GPU train, rest idle."

target:
  service: sing
  name: msrresrchbasicvc
  workspace_name: msra-sh-aml-ws

environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04

code:
  local_dir: $CONFIG_DIR/

jobs:
  - name: boltzmann_e8_planx
    sku: 80G4-H100
    sla_tier: standard
    priority: high
    identity: managed
    submit_args:
      max_run_duration_seconds: 1209600
      env:
        _AZUREML_SINGULARITY_JOB_UAI: "/subscriptions/c4c534bc-9978-4974-9c87-551f7c5754ef/resourceGroups/msra-sh-aml-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/msra-sh-aml-uai"
        HF_TOKEN: ${HF_TOKEN}
        HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
        GH_TOKEN: ${GITHUB_TOKEN}
    command:
      - nvidia-smi
      - mkdir -p /scratch/logs
      - bash -c 'git clone -b facet-rft-2026 https://$${GH_TOKEN}@github.com/iamseungpil/boltzmann-attention.git /scratch/boltzmann-attention || (cd /scratch/boltzmann-attention && git pull --ff-only); bash /scratch/boltzmann-attention/scripts/distill/sopbench/node_setup_h200.sh; bash /scratch/boltzmann-attention/scripts/distill/taskbench/node_setup_taskbench.sh; bash /scratch/boltzmann-attention/scripts/distill/taskbench/node_run_planx.sh' > /scratch/logs/job_bootstrap.log 2>&1
      - echo "plan X bootstrap+train done (or preempted; restart resumes)"
      - sleep infinity
