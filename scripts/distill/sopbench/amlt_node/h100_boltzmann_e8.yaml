description: "boltzmann-attention E8 lane — 2x H100x4 standard node holders (train + eval) for SOPBench Track-B per COWORKER_EXPERIMENT_PLAN v1.42: #0 32B vanilla sanity (react+fc, 1 GPU serving each, run in parallel on eval node), #1 32B LODO-bank SFT + scaffold eval (train node). AUTO-RECOVERY: job command bootstraps (clone+setup) and node_resume.sh <role> pulls state from HF dataset iamseungpil/sopbench-trackb-h200 on every (re)start, so preemption restarts self-heal."

target:
  service: sing
  name: msrresrchbasicvc
  workspace_name: msra-sh-aml-ws

environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04

code:
  local_dir: $CONFIG_DIR/

jobs:
  - name: boltzmann_e8_train
    sku: 80G4-H100
    sla_tier: standard
    priority: high
    identity: managed
    submit_args:
      max_run_duration_seconds: 1209600
      env:
        _AZUREML_SINGULARITY_JOB_UAI: "/subscriptions/c4c534bc-9978-4974-9c87-551f7c5754ef/resourceGroups/msra-sh-aml-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/msra-sh-aml-uai"
        HF_TOKEN: ${HF_TOKEN}
        HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
        GH_TOKEN: ${GITHUB_TOKEN}
    command:
      - nvidia-smi
      - mkdir -p /scratch/logs
      - bash -c 'git clone -b facet-rft-2026 https://$${GH_TOKEN}@github.com/iamseungpil/boltzmann-attention.git /scratch/boltzmann-attention || (cd /scratch/boltzmann-attention && git pull --ff-only); bash /scratch/boltzmann-attention/scripts/distill/sopbench/node_setup_h200.sh' > /scratch/logs/job_bootstrap.log 2>&1
      - echo "auto-bootstrap done (role=train); holder alive"
      - sleep infinity

  - name: boltzmann_e8_eval
    sku: 80G4-H100
    sla_tier: standard
    priority: high
    identity: managed
    submit_args:
      max_run_duration_seconds: 1209600
      env:
        _AZUREML_SINGULARITY_JOB_UAI: "/subscriptions/c4c534bc-9978-4974-9c87-551f7c5754ef/resourceGroups/msra-sh-aml-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/msra-sh-aml-uai"
        HF_TOKEN: ${HF_TOKEN}
        HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
        GH_TOKEN: ${GITHUB_TOKEN}
    command:
      - nvidia-smi
      - mkdir -p /scratch/logs
      - bash -c 'git clone -b facet-rft-2026 https://$${GH_TOKEN}@github.com/iamseungpil/boltzmann-attention.git /scratch/boltzmann-attention || (cd /scratch/boltzmann-attention && git pull --ff-only); bash /scratch/boltzmann-attention/scripts/distill/sopbench/node_setup_h200.sh' > /scratch/logs/job_bootstrap.log 2>&1
      - echo "auto-bootstrap done (role=eval); holder alive"
      - sleep infinity
